name: TeclaScore CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teclascore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/ci/requirements.txt
      - name: Install test dependency
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r tools/ci/requirements.txt
      - name: Build, run console suites, Python, WPF and synthetic benchmarks
        run: |
          ./tools/verify_ci.ps1 -PythonPath python -OutputDirectory "${{ runner.temp }}/teclas-ci" -BenchmarkIterations 5
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teclascore-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/teclas-ci/reports/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
